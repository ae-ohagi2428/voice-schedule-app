{% load static %}
<header class="hero-header pb-5">
    <div class="flex justify-end   px-[18px] pt-2">
      <div class="flex items-center gap-2">
        {% if user.is_authenticated %}
          <a href="{% url 'schedules:dashboard' %}" class="header-btn">ダッシュボードへ</a>
        {% else %}
          <a href="{% url 'accounts:login' %}" class="header-btn">ログイン</a>
          <a href="{% url 'accounts:register' %}" class="header-btn">新規登録</a>
        {% endif %}
      </div>
    </div>
  <div class="flex items-center justify-center gap-3 px-6 pt-1">
    <img src="{% static 'images/character/character_icon.webp' %}" alt="キャラクター「るるる」"
        class="w-[56px] h-[56px] flex-none rounded-full object-cover bg-white">
    <div class="flex flex-col gap-0.5">
      <div class="font-maru font-bold text-[24px] text-white">
        <a href="{% url 'home:index' %}" class="text-inherit hover:text-inherit">ときよみ★</a>
      </div>
      <div class="font-kaku text-[14px] text-white/90">しゃべるタスク管理アプリ</div>
      </div>
    </div>
</header>
