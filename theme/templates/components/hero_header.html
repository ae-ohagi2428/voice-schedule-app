{% load static %}
<header class="hero-header">
  {% if show_buttons %} 
    <div class="flex justify-end px-[18px] pt-2 gap-2">
      <a href="{% url 'accounts:login' %}" class="header-btn">ログイン</a>
      <a href="{% url 'accounts:register' %}" class="header-btn">新規登録</a>
    </div>
  {% endif %}
  <div class="flex flex-col items-center gap-2.5 px-6 pt-4">
    <img src="{% static 'images/character.png' %}" alt=""
        class="w-[100px] h-[100px] rounded-full object-cover bg-white">
    <div class="font-maru font-bold text-[21px] text-white">とき★よみ</div>
    <div class="font-kaku text-[11.5px] text-white/90">楽しい時間をすごす魔法。</div>
  </div>
</header>
