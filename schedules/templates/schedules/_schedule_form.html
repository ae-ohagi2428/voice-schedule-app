<!-- 予定1件分の行 -->
<div class="flex flex-col gap-1 schedule-row {% if form.DELETE.value %}hidden{% endif %}"
  {% if not form.instance.pk %}data-new{% endif %}
  {% if form.errors %}data-error{% endif %}>
  {{ form.id }}
  <span class="hidden">{{ form.DELETE }}</span>
  <div class="row-card bg-white rounded-[18px] border px-3.5 py-2.5
    {% if form.errors %}border-rose-mark{% else %}border-[#E2DAEE]{% endif %}">
    <button type="button" class="row-summary w-full flex items-center gap-2.5 text-left">
      <span class="summary-time w-[86px] shrink-0 text-[12px] font-semibold text-[#736D87] tabular-nums"></span>
      <span class="summary-title flex-1 min-w-0 truncate text-[13.5px] font-semibold text-[#5B5373]"></span>
      <span class="summary-duration shrink-0 text-[11px] text-[#736D87]"></span>
      <span class="summary-error text-rose-mark shrink-0 text-[12px] font-bold {% if form.errors %}hidden{% endif %}">！</span>
    </button>
    <div class="row-editor hidden flex flex-col gap-3">
      <div class="flex items-center gap-3">
        <div class="title-line flex-1 min-w-0 flex items-center gap-2 border-b-[1.5px] border-[#E4DBF2] pb-1.5">
          {{ form.title }}
          <svg class="shrink-0" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9B86C9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path>
          </svg>
        </div>
        <button type="button" class="delete-btn shrink-0 flex items-center gap-1 h-7 px-2.5 rounded-full
          bg-[#BE4A5A] text-white text-[11.5px] font-semibold">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"></path>
          </svg>
          削除
        </button>
      </div>
      <div class="flex items-end gap-2 time-line">
        <div class="flex-1 min-w-0 flex flex-col gap-1">
          <label for="{{ form.start_time.id_for_label }}" class="field-label">はじめ</label>
          {{ form.start_time }}
        </div>
        <span class="text-[14px] font-semibold text-[#B3ADC0] pb-2.5">→</span>
        <div class="flex-1 min-w-0 flex flex-col gap-1">
          <label for="{{ form.end_time.id_for_label }}" class="field-label">おわり</label>
          {{ form.end_time }}
        </div>
      </div>
      <span class="editor-duration text-center text-[10.5px] font-semibold text-[#736D87]"></span>
      <div class="row-errors flex flex-col gap-1">
        {% for error in form.non_field_errors %}
          <p class="field-error">{{ error }}</p>
        {% endfor %}
        {% for field in form.visible_fields %}
          {% for error in field.errors %}
            <p class="field-error">{{ error }}</p>
          {% endfor %}
        {% endfor %}
      </div>
      <p class="overlap-error field-error hidden"></p>
      
      <div class="flex justify-center gap-2">
        <button type="button" class="cancel-btn min-w-[96px] h-9 px-5 rounded-[12px] bg-white border border-[#5B5373]/10 text-[#5B5373] text-[12.5px] font-semibold">
          キャンセル
        </button>
        <button type="button" class="close-btn min-w-[96px] h-9 px-6 rounded-[12px] bg-[#6B5B93] text-white text-[12.5px] font-bold">
          OK
        </button>
      </div>
    </div>
  </div>
  <div class="shift-notice hidden flex flex-col gap-2 rounded-[14px] bg-[#F8EEF4] border border-[#EFDCE7] p-[10px]">
    <p class="shift-notice-text text-[11.5px] text-[#5B5373]"></p>
    <div class="flex gap-2">
      <button type="button" class="auto-shift-btn flex-1 h-9 rounded-[12px] bg-[#6B5B93] text-white text-[12px] font-bold">
        まとめてずらす
      </button>
      <button type="button" class="keep-btn w-[88px] h-9 rounded-[12px] bg-white text-[#5B5373] text-[12px] font-semibold">
        このまま
      </button>
    </div>
  </div>
</div>
