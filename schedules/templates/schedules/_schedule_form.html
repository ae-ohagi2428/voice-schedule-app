<div class="flex flex-col gap-1 schedule-row {% if form.DELETE.value %}hidden{% endif %}">
  <div class="bg-white rounded-[18px] border p-3 flex items-center gap-3 {% if form.instance.pk %}border-[#E2DAEE]{% else %}border-[#C0708F]{% endif %}">
    {{ form.id }}
    <div class="flex flex-col items-center gap-1 w-[120px] shrink-0">
      {{ form.start_time }}
      <span class="inline-block rotate-90 text-muted">〜</span>
      {{ form.end_time }}
    </div>
    <div class="flex-1">
      {{ form.title }}
    </div>
    <span class="hidden">{{ form.DELETE }}</span>
    <button type="button" class="delete-btn">×</button>
  </div>
  {% for error in form.non_field_errors %}
    <p class="field-error">{{ error }}</p>
  {% endfor %}
  {% for field in form.visible_fields %}
    {% for error in field.errors %}
      <p class="field-error">{{ error }}</p>
    {% endfor %}
  {% endfor %}
  <div class="flex flex-col items-center">
    <button type="button" class="add-btn">⊕</button>
    <button type="button" class="auto-shift-btn hidden text-xs"></button>
  </div>  
</div>
