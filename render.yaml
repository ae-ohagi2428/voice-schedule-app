databases:
  - name: voice-schedule-app-db
    plan: free
    databaseName: voice_schedule_app
    user: voice_schedule_app

services:
  - type: web
    plan: free
    name: voice-schedule-app-web
    runtime: python
    buildCommand: './build.sh'
    startCommand: 'python -m gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: voice-schedule-app-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4